# Docker Compose cho E-commerce AI Agent (MVP).
# Lưu ý: KHÔNG có Postgres trong file này nữa. Dữ liệu của web (người dùng,
# sản phẩm, giỏ hàng, đơn hàng) giữ ở SQLite (file shop.db trong apps/api),
# theo quyết định của người dùng. Vector DB cho RAG là Qdrant dưới đây.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      PORT: "4000"
      # DB nằm ở /data (volume shopdata), TÁCH RIÊNG khỏi thư mục code.
      # Đừng mount volume đè lên /app/apps/api: volume sẽ che code trong
      # image, rebuild xong container vẫn chạy code cũ trong volume.
      DATABASE_URL: file:/data/shop.db
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-shop_knowledge}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cho-demo}
    ports:
      - "4000:4000"
    volumes:
      - shopdata:/data
    depends_on:
      - qdrant
      - redis

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  qdrant_data:
  shopdata:
